name: Build & Release PSP Homebrew

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version du tag (ex: v1.0.0)'
        required: true
        default: 'v1.0.0'
      prerelease:
        description: 'Marquer comme pré-release ?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer ZIP
        run: |
          apk update
          apk add --no-cache zip

      - name: Build EBOOT.PBP
        run: |
          make clean || true
          make -j$(nproc)

      - name: Vérifier EBOOT.PBP
        run: |
          if [ ! -f EBOOT.PBP ]; then
            echo "Erreur : EBOOT.PBP introuvable !"
            exit 1
          fi
          ls -lh EBOOT.PBP

      - name: Préparer le package
        run: |
          mkdir -p release/PSP/GAME/CitroPSP
          cp EBOOT.PBP release/PSP/GAME/CitroPSP/

          cd release
          zip -r ../CitroPSP-${{ github.event.inputs.version }}.zip .

      - name: Upload artifact (debug)
        uses: actions/upload-artifact@v4
        with:
          name: CitroPSP-EBOOT
          path: |
            EBOOT.PBP
            CitroPSP-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: La Nuit des Citrouilles ${{ github.event.inputs.version }}
          body: |
            ## La Nuit des Citrouilles – Edition PSP

            ### Installation

            1. Télécharge le fichier ZIP.
            2. Extrais-le à la racine de ta Memory Stick ou du dossier PPSSPP.
            3. Tu obtiens :
               PSP/GAME/CitroPSP/EBOOT.PBP
            4. Lance le jeu depuis ta PSP ou PPSSPP.

            ### Compilation
            Construit automatiquement avec PSPDEV.

          files: |
            EBOOT.PBP
            CitroPSP-${{ github.event.inputs.version }}.zip
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
