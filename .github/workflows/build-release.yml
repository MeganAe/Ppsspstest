name: Build & Release PSP Homebrew

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version du tag (ex: v1.0.3)'
        required: true
        default: 'v1.0.3'
      prerelease:
        description: 'Marquer comme pré-release ?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Outils
        run: |
          apk update
          apk add --no-cache zip xorriso

      - name: Build EBOOT.PBP
        run: |
          make clean || true
          make -j$(nproc)

      - name: Vérifier
        run: |
          test -f EBOOT.PBP
          test -f CitroPSP.elf
          test -f PARAM.SFO

      - name: Créer l'ISO
        run: |
          rm -rf iso
          mkdir -p iso/PSP_GAME/SYSDIR
          cp PARAM.SFO iso/PSP_GAME/PARAM.SFO
          cp CitroPSP.elf iso/PSP_GAME/SYSDIR/EBOOT.BIN
          cp CitroPSP.elf iso/PSP_GAME/SYSDIR/BOOT.BIN
          printf '%s\n' 'NPEH00001|00000000000000000000000000000000|La Nuit des Citrouilles|' > iso/UMD_DATA.BIN
          xorriso -as mkisofs -iso-level 4 -joliet \
            -volid "CITROPSP" \
            -o "CitroPSP-${{ github.event.inputs.version }}.iso" \
            iso

      - name: ZIP homebrew (PSP réelle)
        run: |
          mkdir -p release/PSP/GAME/CitroPSP
          cp EBOOT.PBP release/PSP/GAME/CitroPSP/
          (cd release && zip -r "../CitroPSP-${{ github.event.inputs.version }}.zip" .)

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: La Nuit des Citrouilles ${{ github.event.inputs.version }}
          body: |
            ## Téléphone (PPSSPP)
            Télécharge `CitroPSP-….iso` et mets-le dans le dossier des jeux de PPSSPP.
            Il apparaît dans la liste. Rien à coller dans `PSP/GAME`.

            ## PSP réelle
            Le ZIP contient `PSP/GAME/CitroPSP/EBOOT.PBP`.
            Extrais-le à la racine de la Memory Stick.
          files: |
            CitroPSP-${{ github.event.inputs.version }}.iso
            EBOOT.PBP
            CitroPSP-${{ github.event.inputs.version }}.zip
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
